# <-- Important! Change this for each experiment.
experiment:
    instruct_status: "ReplaceMeInScript"
    exp_name: "InBatch"
    description: "${model.name} ${model.size} ${experiment.instruct_status} ${experiment.exp_name}"
    path_suffix: "${model.short_name}/${model.size}/${experiment.instruct_status}/${experiment.exp_name}/"

# Index settings
index_config:

    faiss_config:
        idx_type: Flat
        dim: 3584 # match the dimension of model's dim
        metric: METRIC_INNER_PRODUCT

    # Path
    embed_dir_name: "embed"
    index_dir_name: "index"

    cand_pools_config:
        enable_idx: True
        cand_pools_name_to_idx:
            - "visualnews_task0"
            - "mscoco_task0_test"
            - "fashion200k_task0"
            - "webqa_task1"
            - "edis_task2"
            - "webqa_task2"
            - "visualnews_task3"
            - "mscoco_task3_test"
            - "fashion200k_task3"
            - "nights_task4"
            - "oven_task6"
            - "infoseek_task6"
            - "fashioniq_task7"
            - "cirr_task7"
            - "oven_task8"
            - "infoseek_task8"

# Model settings
model:
    name: "BLIPFeatureFusion"
    short_name: "BLIP_FF"
    size: "Large"
